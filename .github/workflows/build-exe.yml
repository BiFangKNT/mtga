name: 构建 MTGA 可执行程序

on:
  push:
    branches: [ gui ]
    paths:
      - '**.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'run_mtga_gui_wrapped.spec'
  pull_request:
    branches: [ gui ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 确认 spec 文件存在（调试用）
        run: |
          dir run_mtga_gui_wrapped.spec
        shell: cmd

      - name: 构建可执行程序
        run: |
          pyinstaller run_mtga_gui_wrapped.spec
        working-directory: .

      - name: 查看打包结果（调试用）
        run: |
          dir /s /b dist\*.exe
        shell: cmd

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mtga-exe
          path: |
            dist/**/*.exe
            dist/**/*.dll
            dist/**/*.pyd
            dist/**/*.ico
