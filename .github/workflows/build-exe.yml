name: 构建 MTGA 可执行程序

on:
  push:
    branches: [ gui ]
    paths:
      - '**.yml'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'run_mtga_gui_wrapped.spec'
  pull_request:
    branches: [ gui ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 修复程序输入问题（关键步骤）
        run: |
          # 替换 _run_wrapper.py 中的 input() 为非交互式方式（示例逻辑）
          # 若程序需要用户输入，可改为从配置文件或命令行参数读取
          (Get-Content "_run_wrapper.py") -replace 'input\(\)', '"auto-confirm"' | Set-Content "_run_wrapper.py"
        shell: pwsh

      - name: 构建可执行程序（启用控制台以便调试）
        run: |
          # 修改 spec 文件，临时启用控制台输出（解决 stdin 丢失问题）
          (Get-Content "run_mtga_gui_wrapped.spec") -replace 'console=False', 'console=True' | Set-Content "run_mtga_gui_wrapped.spec"
          pyinstaller run_mtga_gui_wrapped.spec
        shell: pwsh

      - name: 查看打包结果
        run: |
          dir /s /b dist\*.exe
        shell: cmd

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mtga-exe
          path: |
            dist/**/*.exe
            dist/**/*.dll
            dist/**/*.pyd
            dist/**/*.ico
